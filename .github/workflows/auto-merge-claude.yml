name: Auto-merge Claude branch to main

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'summaries/**'
      - 'SUMMARIES.md'
      - 'cases/**'
      - 'CASES.md'

permissions:
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Claude branch into main
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git merge "origin/${{ github.ref_name }}" --no-ff \
            -m "merge: ${{ github.ref_name }} を main へ自動統合"
          git push origin main
          git push origin --delete "${{ github.ref_name }}"
